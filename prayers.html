<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhakti Prayers Player</title>
<!-- [Grok.com] Erste Fassung: Ton aus dem Internet Archive, Text zum Mitlesen. -->
<style>
:root{--bg:#1a1410;--gold:#c9a36a;--text:#f3e6d0;--muted:#b7a48c;--card:#2a211b}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--text)}
header{padding:16px;text-align:center}
h1{margin:0;color:var(--gold);font-weight:normal;font-size:1.7rem}
.sub{color:var(--muted);margin-top:8px;font-size:.95rem;max-width:40rem;margin-left:auto;margin-right:auto;line-height:1.45}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid #3d2f26;padding:8px 12px 12px;z-index:20}
.now{min-height:1.3em;padding:4px 0}
audio{width:100%;height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{background:#4a372b;color:var(--text);border:1px solid #6b5340;border-radius:7px;padding:8px 12px;min-height:40px}
button.gold{background:#8b6914;border-color:var(--gold)}
.list{margin:12px;display:grid;gap:8px}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr 1fr}}
.item{text-align:left;padding:12px;background:transparent;width:100%}
.item.active{background:#4a372b;color:var(--gold)}
.quelle{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.panel{margin:12px;background:var(--card);border:1px solid #6b5340;border-radius:12px;max-height:62vh;overflow:auto;padding:12px 16px}
.line{padding:8px 6px;border-radius:6px;cursor:pointer}
.line .sa{display:block}
.line .de{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.line.on{background:#4a372b;color:var(--gold)}
.line.on .de{color:#e4d2b4}
.hint{color:var(--muted);font-size:.85rem;margin:0 12px 16px}
a{color:var(--gold)}
footer{text-align:center;padding:20px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Bhakti Prayers Player</h1>
  <p class="sub">Gesänge zum Mitlesen und Lernen. Ton aus frei angebotenen Aufnahmen. Textfenster wie beim Excerpt: die aktuelle Zeile bleibt sichtbar.</p>
</header>
<div class="bar">
  <div class="now" id="now">Einen Gesang wählen</div>
  <audio id="a" controls preload="none" playsinline></audio>
  <div class="row">
    <button type="button" onclick="prevLine()">Vorherige Zeile</button>
    <button type="button" class="gold" onclick="nextLine()">Nächste Zeile</button>
  </div>
</div>
<div class="list" id="list"></div>
<p class="hint" id="hint"></p>
<div class="panel" id="lyrics"></div>
<footer>
  Persönliches Lernen. Quellen jeweils unter dem Titel.<br>
  <a href="./">Tadatmya Vedanta Player</a>
</footer>
<script src="prayers.js"></script>
<script>
var i=-1, line=0;
var a=document.getElementById("a");
function paintList(){
  var box=document.getElementById("list");
  box.innerHTML="";
  PRAYERS.forEach(function(P,idx){
    var b=document.createElement("button");
    b.type="button";
    b.className="item"+(idx===i?" active":"");
    b.innerHTML=P.titel+"<span class='quelle'>"+P.autor+" · "+P.quelle+"</span>";
    b.onclick=function(){ play(idx); };
    box.appendChild(b);
  });
}
function paintLyrics(){
  var P=PRAYERS[i];
  var box=document.getElementById("lyrics");
  if(!P){ box.innerHTML=""; return; }
  box.innerHTML=P.zeilen.map(function(z,n){
    return "<div class='line"+(n===line?" on":"")+"' data-n='"+n+"'><span class='sa'>"+z.sa+"</span><span class='de'>"+z.de+"</span></div>";
  }).join("");
  var on=box.querySelector(".line.on");
  if(on) on.scrollIntoView({block:"center",behavior:"smooth"});
  box.querySelectorAll(".line").forEach(function(el){
    el.onclick=function(){ line=parseInt(el.getAttribute("data-n"),10); paintLyrics(); };
  });
}
function play(idx){
  i=idx; line=0;
  var P=PRAYERS[i];
  document.getElementById("now").textContent=P.titel;
  document.getElementById("hint").textContent=P.hinweis;
  a.src=P.audio;
  a.play().catch(function(){});
  paintList(); paintLyrics();
}
function nextLine(){ if(i<0) return; line=Math.min(line+1, PRAYERS[i].zeilen.length-1); paintLyrics(); }
function prevLine(){ if(i<0) return; line=Math.max(line-1, 0); paintLyrics(); }
paintList();
</script>
</body>
</html>
